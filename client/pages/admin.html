
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Panel</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

  <header>
    <h1>Панель администратора</h1>

    <nav>
      <a href="../index.html">Главная</a>
      <a href="about.html">О компании</a>
      <a href="services.html">Услуги</a>
      <a href="portfolio.html">Портфолио</a>
      <a href="contacts.html">Контакты</a>
    </nav>
  </header>

  <main>

    <!-- LOGIN -->

    <section
      id="login-section"
      class="admin-card"
    >
      <h2>Вход администратора</h2>

      <form id="login-form">

        <div>
          <label for="username">
            Логин:
          </label>

          <input
            type="text"
            id="username"
            required
          >
        </div>

        <div>
          <label for="password">
            Пароль:
          </label>

          <input
            type="password"
            id="password"
            required
          >
        </div>

        <button type="submit">
          Войти
        </button>

      </form>

      <p id="login-message"></p>
    </section>


    <!-- ADMIN PANEL -->

    <section
      id="admin-section"
      class="admin-card"
      hidden
    >

      <button id="logout-button">
        Выйти
      </button>


      <!-- ЗАЯВКИ -->

      <h2>Заявки клиентов</h2>

      <div id="requests-container">
        Загрузка заявок...
      </div>


      <!-- ПОРТФОЛИО -->

      <hr>

      <h2>Управление портфолио</h2>

      <form id="project-form">

        <input
          type="hidden"
          id="project-id"
        >

        <div>
          <label for="project-title">
            Название:
          </label>

          <input
            type="text"
            id="project-title"
            required
          >
        </div>

        <div>
          <label for="project-description">
            Описание:
          </label>

          <textarea
            id="project-description"
            rows="5"
            required
          ></textarea>
        </div>

        <div>
          <label for="project-category">
            Категория:
          </label>

          <input
            type="text"
            id="project-category"
            required
          >
        </div>

        <div>
          <label for="project-date">
            Дата завершения:
          </label>

          <input
            type="date"
            id="project-date"
          >
        </div>

        <button type="submit">
          Сохранить проект
        </button>

        <button
          type="button"
          id="project-cancel-button"
          hidden
        >
          Отмена
        </button>

      </form>

      <p id="project-message"></p>

      <div id="projects-container">
        Загрузка проектов...
      </div>


      <!-- УСЛУГИ -->

      <hr>

      <h2>Управление услугами</h2>

      <form id="service-form">

        <input
          type="hidden"
          id="service-id"
        >

        <div>
          <label for="service-title">
            Название услуги:
          </label>

          <input
            type="text"
            id="service-title"
            required
          >
        </div>

        <div>
          <label for="service-description">
            Описание:
          </label>

          <textarea
            id="service-description"
            rows="4"
            required
          ></textarea>
        </div>

        <button type="submit">
          Сохранить услугу
        </button>

        <button
          type="button"
          id="service-cancel-button"
          hidden
        >
          Отмена
        </button>

      </form>
<hr>

<h2>Управление страницами</h2>

<form id="page-form">

  <input
    type="hidden"
    id="page-id"
  >

  <div>
    <label for="page-title">
      Заголовок:
    </label>

    <input
      type="text"
      id="page-title"
      required
    >
  </div>

  <div>
    <label for="page-content">
      Текст страницы:
    </label>

    <textarea
      id="page-content"
      rows="8"
      required
    ></textarea>
  </div>

  <button type="submit">
    Сохранить изменения
  </button>

  <button
    type="button"
    id="page-cancel-button"
    hidden
  >
    Отмена
  </button>

</form>

<p id="page-message"></p>

<div id="pages-container">
  Загрузка страниц...
</div>
      <p id="service-message"></p>

      <div id="services-container-admin">
        Загрузка услуг...
      </div>

    </section>

  </main>

  <footer>
    <p>Construction Company</p>
  </footer>

  <script src="../js/admin.js"></script>

</body>
</html>
